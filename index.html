<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mis canciones</title>
  <style>
    body {
      background: #0f0f0f;
      color: #eee;
      font-family: Georgia, serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .player {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 12px;
      width: 320px;
    }
    h1 {
      font-size: 16px;
      margin: 12px 0 6px;
    }
    audio {
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="player">
    <h1>Kings Of Leon — Manhattan</h1>
    <audio controls src="Kings Of Leon - Manhattan.mp3"></audio>

    <h1>Bon Iver & St. Vincent — Rosyln</h1>
    <audio controls src="Bon Iver & St. Vincent - Rosyln.mp3"></audio>

    <h1>Coldplay — Sparks</h1>
    <audio controls src="Coldplay - Sparks.mp3"></audio>

    <h1>The Smashing Pumpkins — 1979</h1>
    <audio controls src="The Smashing Pumpkins - 1979.mp3"></audio>

    <h1>Muse — Madness</h1>
    <audio controls src="Muse - Madness.mp3"></audio>

    <h1>10cc — Green Eyed Monster</h1>
    <audio controls src="10cc - Green Eyed Monster.mp3"></audio>
  </div>

</body>
</html>
